[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwg-text-checks"
version = "0.1.0"
description = "Extract text from .dwg/.dxf drawings and run a small set of text-based rule checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ezdxf>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dwgtext = "dwg_text_checks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
